'''Startpage''', also known as '''Startpage.com''', is a [[Netherlands]]-based [[search engine]] website that highlights privacy as its distinguishing feature.<ref>{{Cite web |date=2008-07-13 |title=First European Privacy Seal Awarded |url=http://www.businesswire.com/portal/site/google/?ndmViewId=news_view&newsId=20080714005501&newsLang=en|archive-url=https://web.archive.org/web/20170910172620/http://www.businesswire.com/portal/site/google/?ndmViewId=news_view&newsId=20080714005501&newsLang=en|archive-date=2017-09-10|access-date=2022-03-13 |website=Businesswire.com}}</ref><ref>{{Cite web |title=EU Awards First Privacy Seal to Online Search Engine Ixquick.com |url=https://privacy.org/archives/002527.html |access-date=2022-03-13 |website=privacy.org}}</ref><ref name="expressvpn">ExpressVPN.com, [https://www.expressvpn.com/blog/ixquick-startpage/ "Free Search Engines: What You're Looking For?"], 19 January 2015, retrieved 5 April 2016.</ref> The website advertises that it allows users to obtain [[Microsoft Bing|Bing Search]] and [[Google Search]] results while protecting users' privacy by not storing personal information or search data and removing all [[Internet tracking|trackers]].<ref>{{Cite web |date=2023-03-08 |title=What is the relationship between Startpage and your search partners, like Google and Microsoft Bing? |url=https://support.startpage.com/hc/en-us/articles/4522435533844-What-is-the-relationship-between-Startpage-and-your-search-partners-like-Google-and-Microsoft-Bing |access-date=2025-01-06 |website=Startpage Support |language=en-US}}</ref> Startpage.com also includes an Anonymous View browsing feature that allows users the option to open search results via [[Proxy server|proxy]] for increased anonymity.<ref>{{Cite web |title=How does Anonymous View work? - Startpage.com Support |url=https://support.startpage.com/index.php?/en/Knowledgebase/Article/View/117/0/how-does-anonymous-view-work |access-date=2022-03-01 |website=support.startpage.com|archive-url= https://web.archive.org/web/20220301211725/https://support.startpage.com/index.php?/en/Knowledgebase/Article/View/117/0/how-does-anonymous-view-work|archive-date= 1 March 2022|url-status=dead}}</ref> Startpage is owned and operated by Surfboard Holding BV, which is majority owned by [[System1]], an American internet advertising company.

==History==

=== Early history ===
{{vanchor|Ixquick}} was created in 1998 by David Bodnick in [[New York City]].<ref name=":0">{{cite web|last=Dowdell|first=Jason|date=23 March 2005|title=IXQuick.com Q & A With David Bodnick & Alex van Eesteren|url=http://www.marketingshift.com/2005/3/ixquickcom-q-with-david-bodnick-alex.cfm|access-date=22 January 2019|website=Marketing Shift|archive-date=21 August 2006|archive-url=https://web.archive.org/web/20060821225505/http://www.marketingshift.com/2005/3/ixquickcom-q-with-david-bodnick-alex.cfm|url-status=dead}}</ref> Initially, it provided [[metasearch]] for 14 different web and directory search engines as well as images, news, and [[MP3]] engines.<ref>{{cite journal|url=http://www.ariadne.ac.uk/issue/23/search-engines/|title=Search Engines: 'Ixquick', a Multi-Search Engine With a Difference|first=Phil|last=Bradley|date=22 January 2019|journal=Ariadne|issue=23|access-date=22 January 2019|via=www.ariadne.ac.uk}}</ref> Results were sorted after evaluating how relevant each of the search tools found the query.<ref>{{cite web|url=https://archive.org/details/computer_shopper_2000-11|title=Computer Shopper (November 2000)|date=1 November 2000|access-date=22 January 2019|via=Internet Archive}}</ref> Surfboard Holding BV, a company based in [[Zeist]], Netherlands, and led by CEO Robert E. G. Beens, acquired Ixquick in 2000.<ref>{{Cite news|date=11 June 2013|title=Alternative zu Google: Ixquick bzw. Startpage|work=News.ch|url=http://www.news.ch/Alternative+zu+Google+Ixquick+bzw+Startpage/589462/detail.htm|access-date=14 September 2020}}</ref> Ixquick was re-launched on 23 March 2005 with new features including a redesigned metasearch algorithm.<ref name=":0" /><ref>"[https://web.archive.org/web/20070927202218/http://www.hventure.nl/eng/surfboard0305.html New Ixquick International Search Engine Unveiled]" www.hventure.nl. 23 March 2005.</ref>

[[File:Ixquick2001.png|thumb|The Ixquick webpage as it appeared in 2001]]
Startpage.com began as a [[web directory]] on January 28th, 1998<ref>{{Cite web|title=Starting Page Media Kit|url=http://startingpage.com/media/startingpage_media_kit.html|url-status=dead|archive-url=https://web.archive.org/web/20001214044300/http://startingpage.com/media/startingpage_media_kit.html|archive-date=14 December 2000|access-date=27 April 2025|website=Startpage}}</ref> and started [[Mirror site|mirroring]] Ixquick in 2003.<ref>{{Cite web|title=Startpage.com Homepage|url=http://www.startpage.com/|url-status=dead|archive-url=https://web.archive.org/web/20030209035810/http://www.startpage.com/|archive-date=9 February 2003|access-date=17 August 2020|website=Startpage}}</ref> On 7 July 2009, the company re-launched Startpage.com to fetch results only from the [[Google Search|Google search engine]].<ref>{{Cite web|date=26 July 2015|title=What is the difference between StartPage and Ixquick?|url=https://support.startpage.com/index.php?/Knowledgebase/Article/View/55/7/when-is-your-startmail-private-email-service-going-to-be-released|url-status=dead|archive-url=https://web.archive.org/web/20160208011605/https://support.startpage.com/index.php?%2FKnowledgebase%2FArticle%2FView%2F103%2F0%2Fwhat-is-the-difference-between-startpage-and-ixquick|archive-date=8 February 2016|access-date=7 August 2013|website=Startpage Support Center}}</ref> Prior to the release of [[Tor (anonymity network)#Tor Browser|Tor Browser]] version 4.5 in April 2015, Startpage.com was its default search engine.<ref>{{cite web|title=Tor Browser 4.5 is released|url=https://blog.torproject.org/blog/tor-browser-45-released|access-date=16 September 2015|publisher=blog.torproject.org}}</ref>

=== Merger and recent history ===
On 29 March 2016, Ixquick.com was merged into the Startpage.com search engine. However, Ixquick was still available at Ixquick.eu, Ixquick.info and the Ixquick Search App until 2nd of April 2018, when they were discontinued.<ref name="notice">{{cite web|url = https://ixquick.com/eng/ixquick-merged-with-startpage.html?lmv=1|title = We've streamlined the fight against Big Brother!|access-date = 5 April 2016|work = Ixquick.com|date = 30 March 2016|archive-url = https://web.archive.org/web/20160416103904/https://www.ixquick.eu/eng/press/startpage-and-ixquick-join-forces.html?hmb=1|archive-date = 16 April 2016}}</ref><ref>{{Cite web |title=Why do you no longer offer the Ixquick search engine? - Startpage Support |url=https://support.startpage.com/hc/en-us/articles/4455529976852-Why-do-you-no-longer-offer-the-Ixquick-search-engine |url-status=live |archive-url=https://web.archive.org/web/20240625123359/https://support.startpage.com/hc/en-us/articles/4455529976852-Why-do-you-no-longer-offer-the-Ixquick-search-engine |archive-date=2024-06-25 |access-date=2024-11-20 |website=Startpage}}</ref><ref>{{Cite web |last=Brinkmann |first=Martin |date=2018-04-02 |title=Search engine Ixquick.eu redirects to Startpage.com - gHacks Tech News |url=https://www.ghacks.net/2018/04/02/search-engine-ixquick-eu-redirects-to-startpage-com/ |url-status=live |archive-url=https://web.archive.org/web/20180413075125/https://www.ghacks.net/2018/04/02/search-engine-ixquick-eu-redirects-to-startpage-com/ |archive-date=2018-04-13 |access-date=2024-11-20 |website=gHacks Technology News |language=en-US}}</ref> As of 2017, Startpage fields an estimated 2 billion searches{{Quantify|date=September 2025|reason=Billion searches per what time period?}}. The company was one of 200 European companies that opposed the F.C.C. implementation of policies ending [[net neutrality]].<ref>{{Cite news|last1=Alderman|first1=Liz|last2=Tsang|first2=Amie|date=10 December 2017|title=Net Neutrality's Holes in Europe May Offer Peek at Future in U.S.|language=en-US|work=The New York Times|url=https://www.nytimes.com/2017/12/10/business/net-neutrality-europe-fcc.html|access-date=17 August 2020|issn=0362-4331}}</ref>

In October 2019, Privacy One Group, owned by adtech company [[System1]], acquired a majority stake in Startpage. An initial lack of transparency surrounding the deal caused some concern among privacy researchers, leading to its removal from the [[Privacy Guides|PrivacyTools]] review website.<ref>{{Cite web |last=Leonard |first=John |date=2020-01-13 |title=Escape from Google: 12 privacy-promoting search engines reviewed |url=https://www.computing.co.uk/feature/3084966/escape-from-google-12-privacy-search-engines-review/page/2 |access-date=2023-03-25 |website=[[Computing (magazine)|Computing]] |language=en}}</ref><ref>{{Cite web |title=PrivacyTools beveelt Startpage niet meer aan na onduidelijkheid over investering |url=https://tweakers.net/nieuws/160006/privacytools-beveelt-startpage-niet-meer-aan-na-onduidelijkheid-over-investering.html |access-date=2023-03-25 |website=Tweakers |language=NL}}</ref> After responding to questions from PrivacyTools team members, Startpage was able to clarify that the acquisition would not impact their privacy-focused mission, and its recommendation was ultimately restored.<ref>{{Cite web |date=2020-07-03 |title=Privacy-focused search engine Startpage gives more details of the System1 investment |url=https://www.computing.co.uk/news/4017337/privacy-focused-search-engine-startpage-details-system1-investment |access-date=2023-03-25 |website=www.computing.co.uk |language=en}}</ref><ref>{{Cite web |last= |first= |date=2020-05-04 |title=Startpage relisted on PrivacyTools as a recommended private search engine |url=https://www.startpage.com/privacy-please/startpage-articles/startpage-relisted-on-privacytools |access-date=2023-03-25 |website=Startpage.com Blog}}</ref> According to the company, its "founders may unilaterally reject any potential technical change that could negatively affect user privacy".<ref>{{Cite web|last=Brinkmann|first=Martin|date=18 November 2019|title=Startpage replies to questions about ownership change|url=https://www.ghacks.net/2019/11/18/startpage-replies-to-questions-about-ownership-change/|access-date=17 August 2020|website=Ghacks}}</ref><ref>{{Cite web|last=Brinkmann|first=Martin|date=16 November 2019|title=Startpage Search owner changes raise serious questions|url=https://www.ghacks.net/2019/11/16/startpage-search-owner-changes-raise-serious-questions/|access-date=17 August 2020|website=Ghacks}}</ref> By maintaining its headquarters and operations in the Netherlands, Startpage continues to be protected by Dutch and [[European Union]] (EU) privacy laws.<ref>{{Cite web|last=Sullivan|first=Laurie|date=15 January 2020|title=Ties Binding Verizon To System1's Startpage Privacy Search Engine|url=https://www.mediapost.com/publications/article/345738/ties-binding-verizon-to-system1s-startpage-privac.html|access-date=17 August 2020|website=InsidePerformance|publisher=MediaPost Communications|language=en}}</ref>

In May 2020, [[Vivaldi (web browser)|Vivaldi]] announced that its browser had added Startpage as an optional or default search engine.<ref>{{Cite web|last=Brown|first=Eileen|title=Startpage private search engine now an option for Vivaldi browser|url=https://www.zdnet.com/article/startpage-private-search-engine-now-an-option-for-vivaldi-browser/|access-date=14 September 2020|website=ZDNet|language=en}}</ref><ref>{{Cite web|last=Neowin|first=Paul Hill|title=Vivaldi adds Startpage as search option under new agreement|url=https://www.neowin.net/news/vivaldi-adds-startpage-as-search-option-under-new-agreement|access-date=14 September 2020|website=Neowin|language=en}}</ref>

In August 2026, Mozilla added Startpage as a built-in default search engine choice in Firefox 154 for desktop users in Germany, France, Austria, Switzerland, and the Netherlands, with support for Android and iOS planned to follow.<ref>{{cite web |last=Mozilla |title=Startpage comes to Firefox |url=https://blog.mozilla.org/en/firefox/startpage-on-firefox/ |website=The Mozilla Blog |date=August 18, 2026 |access-date=August 19, 2026}}</ref><ref>{{cite web |last=Mozilla |title=Built-In Privacy: Startpage Lands in Firefox Across Five European Countries |url=https://www.startpage.com/privacy-please/featured-article/firefox-integration |website=The Startpage Blog |date=August 20, 2026 |access-date=August 20, 2026}}</ref>

== Products ==
On 27 June 2006, following [[Criticism of Google#Google Shopping rankings|criticism of Google Shopping]], the website began to delete private details of its users.<ref>{{cite news|date=27 June 2006|title=Ixquick.com Eliminates 'Big Brother'|publisher=biz.yahoo.com|url=http://biz.yahoo.com/bw/060627/20060627005367.html?.v=1}}</ref> Ixquick stated that it does not share the personal information of users with other search engines or with the provider of its sponsored results.<ref>{{cite news|last=Greenberg|first=Andy|date=15 February 2008|title=The Privacy Paradox|work=Forbes.com|url=https://www.forbes.com/2008/02/15/search-privacy-ask-tech-security-cx_ag_0215search.html|access-date=12 September 2009}}</ref><ref>"[http://ixquick.com/eng/privacy-policy.html Ixquick: Privacy Policy]"</ref> According to ''[[The New York Times]]''<nowiki/>' ''[[Wirecutter (website)|Wirecutter]]'', Startpage does not store user's personal information or search data.<ref>{{Cite news|last=Klosowski|first=Thorin|date=13 July 2020|title=Our Favorite Ad Blockers and Browser Extensions to Protect Privacy|language=en-US|work=The New York Times|url=https://www.nytimes.com/wirecutter/reviews/our-favorite-ad-blockers-and-browser-extensions-to-protect-privacy/|access-date=17 August 2020|issn=0362-4331}}</ref> A May 2020 review of the website on [[ZDNet]] also states that Startpage "does not track, log, or share data or searching history".<ref name=":1">{{Cite web|last=Brown|first=Eileen|date=21 May 2020|title=Startpage private search engine now an option for Vivaldi browser|url=https://www.zdnet.com/article/startpage-private-search-engine-now-an-option-for-vivaldi-browser/|access-date=17 August 2020|website=ZDNet|language=en}}</ref>

In 2011, Startpage received the [[European Privacy Seal]], a European Union–sponsored initiative that indicates compliance with EU laws and regulations on data security and privacy through a series of design and technical audits. It was re-certified in 2013 and 2015.<ref name="pr_eu">Ixquick.eu press release, [https://www.ixquick.eu/eng/press/europrise-reaffirmed.html?hmb=1 "EuroPriSe: Privacy-friendly Internet search with Ixquick and Startpage reaffirmed"] {{Webarchive|url=https://web.archive.org/web/20160416113523/https://www.ixquick.eu/eng/press/europrise-reaffirmed.html?hmb=1 |date=16 April 2016 }}, 20 July 2015, Surfboard Holding B.V., Bonn, Germany, on Ixquick.eu website, retrieved 5 April 2016.</ref> The company has also completely ended the recording of user IP addresses since January 2009.<ref>{{Cite web|last=Duncan|first=Geoff|date=28 January 2010|title=StartPage Search Engine Offers Anonymous Web Browsing|url=https://www.digitaltrends.com/computing/startpage-search-engine-offers-anonymous-web-browsing/|access-date=17 August 2020|website=Digital Trends}}</ref> Because Startpage is based in the Netherlands, it is also "not subject to US laws like the [[Patriot Act]], and cannot be forced to comply with US dragnet surveillance programs, like [[PRISM (surveillance program)|PRISM]]."<ref>{{Cite news|title=StartPage to drop Yahoo from search results|language=en-GB|work=belfasttelegraph|url=https://www.belfasttelegraph.co.uk/business/technology/startpage-to-drop-yahoo-from-search-results-35138188.html|access-date=14 September 2020|date=17 October 2016|issn=0307-1235}}</ref> Startpage has also contributed €20,000 to [[NOYB]], the non-profit organization founded by [[Max Schrems]], which is committed to launching strategic court cases and media initiatives in support of the EU's [[General Data Protection Regulation]].<ref name=":1" />

The company also provides a stand-alone [[proxy server|proxy]] service, Startpage.com Proxy, which is incorporated into the Startpage search engine.<ref>{{Cite book|last=Bradley|first=Phil|url=https://books.google.com/books?id=0hcpDwAAQBAJ&pg=PA84|title=Expert Internet Searching: Fifth edition|date=2017|publisher=Facet Publishing|isbn=978-1-78330-247-5|pages=84|language=en}}</ref> This feature, known as Anonymous View since 2018, allows users the option to open all search results (except advertisements) via the proxy.<ref>{{Cite web|last=Brinkmann|first=Martin|date=25 October 2018|title=Preview of the new Startpage.com|url=https://www.ghacks.net/2018/10/25/preview-of-the-new-startpage-com/|access-date=17 August 2020|website=Ghacks}}</ref><ref>{{Cite web|last=Spadafora|first=Anthony|date=29 November 2018|title=Privacy search engine Startpage launches anonymous browsing feature|url=https://www.techradar.com/news/privacy-search-engine-startpage-launches-anonymous-browsing-feature|access-date=17 August 2020|website=TechRadar|language=en}}</ref>

=== StartMail ===
StartMail, founded in 2014 by Startpage CEO Beens, was developed to offer a privacy protecting [[email]] service.<ref name="techwirenews.com">{{Cite web|last=Aitken|first=Alastair|date=21 April 2014|title=Getting started on StartMail - part one|url=http://techwirenews.com/2014/04/21/getting-started-on-startmail-part-one/|url-status=dead|archive-url=https://web.archive.org/web/20210411144851/http://techwirenews.com/2014/04/21/getting-started-on-startmail-part-one/|archive-date=11 April 2021|access-date=29 September 2021|website=Tech Wire News|language=en-US}}</ref><ref>{{Cite web|last=Benson|first=Thor|title=Russia just blocked its citizens from using ProtonMail|url=https://www.inverse.com/innovation/russia-just-blocked-its-citizens-from-using-protonmail|access-date=14 September 2020|website=Inverse|language=en}}</ref> StartMail also allows the creation of disposable and permanent email aliases for each account.<ref name="techwirenews.com"/> [[Phil Zimmermann]], the inventor of the [[Pretty Good Privacy|PGP]] encryption system who Startpage hired in 2018 to advise the company on privacy technology, has also helped develop StartMail's PGP-encrypted email service.<ref>{{Cite web|title=PGP Encryption Inventor To Advise StartPage Search Engine|url=https://www.mediapost.com/publications/article/320251/pgp-encryption-inventor-to-advise-startpage-search.html|access-date=14 September 2020|website=MediaPost|language=en}}</ref>

Since Startpage.com does not collect user data, it does not serve [[targeted advertising]] based on user data history. The company generates revenue from its search engine by providing [[contextual advertising]] based on the keyword used to perform a search.<ref name=":1" />

