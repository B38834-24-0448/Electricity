      ],
      "get": {
        "tags": [
          "Place"
        ],
        "summary": "Suggest",
        "description": "<label>Example</label><ul><li><a href=\"https://search.longdo.com/mapsearch/json/suggest?keyword=hotel&key=fortestonlydonotuseinproduction!\" target=\"_blank\">Minimum params</a></li><li><a href=\"https://search.longdo.com/mapsearch/json/suggest?keyword=central&area=20&limit=5&key=fortestonlydonotuseinproduction!\" target=\"_blank\">With area and limit</a></li></ul>",
        "operationId": "GetSuggestPlace",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "meta": {
                      "description": "Metadata",
                      "type": "object",
                      "properties": {
                        "keyword": {
                          "description": "Request keyword",
                          "type": "string"
                        }
                      }
                    },
                    "data": {
                      "description": "List of results",
                      "type": "array",
                      "items": {
                        "type": "object",
