        {
          "$ref": "#/components/parameters/area"
        },
        {
          "name": "sdx",
          "in": "query",
          "description": "Soundex matching option (Default: 0). Use 1 to enable Soundex-based fuzzy search for phonetic similarity; use 0 to disable and perform exact matching.",
