          "schema": {
            "type": "number"
          }
        },
        {
          "name": "offset",
          "in": "query",
          "description": "Offset of the first result returned (Default: 0)",
          "required": false,
          "schema": {
            "type": "integer"
          }
        },
        {
          "name": "limit",
          "in": "query",
          "description": "Number of results returned (Default: 10)",
          "required": false,
          "schema": {
            "type": "integer"
          }
        },
        {
          "$ref": "#/components/parameters/suggestDataset"
        },
        {
          "name": "callback",
          "in": "query",
          "description": "JSONP Callback function (Default: Response in JSON)",
          "required": false,
          "schema": {
            "type": "string"
