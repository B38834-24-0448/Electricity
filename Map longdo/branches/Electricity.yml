    "/route-tsp-v2": {
      "servers": [
        {
          "url": "https://api.longdo.com"
        }
      ],
      "post": {
        "tags": [
          "Route"
        ],
        "summary": "TSP (Travelling Salesman Problem) - Route Planner",
        "description": "<label>Example</label><ul><li><a href=\"https://map.longdo.com/blog/route-planner-api/\" target=\"_blank\">Blog</a></li></ul>",
        "operationId": "GetRoutePlanner",
        "requestBody": {
          "required": true,
          "content": {
            "application/x-www-form-urlencoded": {
              "schema": {
                "type": "object",
                "properties": {
                  "key": {
                    "description": "Longdo Map API Key",
                    "type": "string"
                  },
                  "lon[]": {
                    "description": "Longitude list",
                    "type": "array",
                    "items": {
                      "type": "number"
                    }
                  },
                  "lat[]": {
                    "description": "Latitude list",
                    "type": "array",
                    "items": {
                      "type": "number"
                    }
                  },
                  "cost": {
                    "description": "Cost (Default: false) <ul><li>true = time_step and distance_step details will be included</li><li>false = Only the optimal path without additional information will be returned</li></ul>",
                    "type": "boolean",
                    "example": false
                  },
                  "otsp": {
                    "description": "Is Open Loop TSP (Default: false ) <ul><li>true = Return to start/first point</li><li>false = Do not return to start/first point</li></ul>",
                    "type": "boolean",
                    "example": false
                  },
                  "mode": {
                    "description": "Search mode <table><tr><td>Available value</td><td>Description</td></tr><tr><td>t (default)</td><td>Fastest route and avoid traffic congestions, with the real-time or predicted traffic condition (if time is specified)</td></tr><tr><td>c</td><td>Fastest route (disregarding traffic condition), return static travel time</td></tr><tr><td>d</td><td>Shortest route, return static travel time</td></tr><tr><td>e</td><td>Shortest route, return travel time with traffic condition</td></tr></table>",
                    "type": "string",
                    "enum": [
                      "t",
                      "c",
                      "d",
                      "e"
                    ],
                    "default": "t",
                    "example": "t"
                  }
                }
              },
              "encoding": {
                "lon[]": {
                  "style": "form",
                  "explode": true,
                  "allowReserved": true
                },
                "lat[]": {
                  "style": "form",
                  "explode": true,
                  "allowReserved": true
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "description": "Result",
                  "type": "object",
                  "properties": {
                    "status": {
                      "description": "HTTP status code indicating the success or failure of the request",
                      "type": "integer"
                    },
                    "message": {
                      "description": "Description of the status",
                      "type": "string"
                    },
                    "otsp": {
                      "description": "Indicating whether the route is an Open Loop TSP (OTSP) \"0\" = Do not return to start/first point, \"1\" = Return to start/first point",
                      "type": "string"
                    },
                    "mode": {
                      "description": "Route search mode <table><tr><td>Available value</td><td>Description</td></tr><tr><td>t (default)</td><td>Fastest route and avoid traffic congestions, with the real-time or predicted traffic condition (if time is specified)</td></tr><tr><td>c</td><td>Fastest route (disregarding traffic condition), return static travel time</td></tr><tr><td>d</td><td>Shortest route, return static travel time</td></tr><tr><td>e</td><td>Shortest route, return travel time with traffic condition</td></tr></table>",
                      "type": "string"
                    },
                    "body": {
                      "description": "Contains detailed information about the route",
                      "type": "object",
                      "properties": {
                        "sequence": {
                          "description": "Ordered list of indices representing the sequence in which locations should be visited. The sequence is circular, ending where it began",
                          "type": "array",
                          "items": {
                            "type": "integer"
                          }
                        },
                        "location": {
                          "description": "Array of objects, each containing latitude (lat) and longitude (lon) of a specific location",
                          "type": "array",
                          "items": {
                            "$ref": "#/components/schemas/Location"
                          }
                        },
                        "total_distance": {
                          "description": "Total distance (meter) of the optimal route",
                          "type": "integer"
                        },
                        "total_time": {
                          "description": "Total time (second) required to traverse the optimal route",
                          "type": "integer"
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
